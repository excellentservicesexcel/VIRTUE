<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Controle - Álbum</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f4f1ea;
      color: #333;
      padding: 30px 15px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #fff;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    h1 { margin-bottom: 20px; color: #2b1e1a; font-size: 1.6rem; }
    
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }
    input[type="file"], textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    textarea {
      height: 90px;
      resize: vertical;
    }
    button {
      background: #2b1e1a;
      color: #e6c875;
      border: none;
      padding: 12px 20px;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { background: #42302a; }
    button:disabled { background: #888; cursor: not-allowed; }

    .pages-list {
      margin-top: 30px;
    }
    .page-item {
      display: flex;
      align-items: center;
      gap: 15px;
      background: #fdfdfd;
      border: 1px solid #ddd;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 10px;
    }
    .page-item img {
      width: 70px;
      height: 70px;
      object-fit: cover;
      border-radius: 4px;
    }
    .page-item-text {
      flex: 1;
      font-size: 0.95rem;
    }
    .btn-delete {
      background: #c0392b;
      color: #fff;
      padding: 6px 12px;
      font-size: 0.85rem;
    }
    .btn-delete:hover { background: #e74c3c; }

    .link-view {
      display: inline-block;
      margin-bottom: 20px;
      color: #8e44ad;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="container">
    <a href="index.html" class="link-view">← Voltar para o Álbum</a>
    <h1>Painel de Gerenciamento do Álbum (Firebase)</h1>

    <!-- Form de Adicionar -->
    <div class="form-group">
      <label>Selecione a Imagem (Foto):</label>
      <input type="file" id="imageInput" accept="image/*">
    </div>

    <div class="form-group">
      <label>Texto abaixo da Foto (Estilo bilhete vintage):</label>
      <textarea id="textInput" placeholder="Escreva a legenda ou história desta foto..."></textarea>
    </div>

    <button id="addBtn">Adicionar Página ao Álbum</button>

    <!-- Lista de Páginas -->
    <div class="pages-list">
      <h2>Páginas Atuais (<span id="total-count">0</span>)</h2>
      <div id="items-container" style="margin-top: 15px;">Carregando dados...</div>
    </div>
  </div>

  <!-- Script Firebase & Compilador de Imagem -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Configuração do Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyA0EmT6Siq-KQG0_V9qkF6QpS5XXvAIzqQ",
      authDomain: "virtue-4383e.firebaseapp.com",
      databaseURL: "https://virtue-4383e-default-rtdb.firebaseio.com",
      projectId: "virtue-4383e",
      storageBucket: "virtue-4383e.firebasestorage.app",
      messagingSenderId: "387369399356",
      appId: "1:387369399356:web:a6e13e0f894ab875f13f39"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let pagesData = [];

    const imageInput = document.getElementById('imageInput');
    const textInput = document.getElementById('textInput');
    const addBtn = document.getElementById('addBtn');
    const itemsContainer = document.getElementById('items-container');
    const totalCount = document.getElementById('total-count');

    // Função para Compilar/Comprimir a imagem em Base64 leve
    function compressImageToBase64(file, maxWidth = 800, maxHeight = 800, quality = 0.75) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > maxWidth) {
                height = Math.round((height * maxWidth) / width);
                width = maxWidth;
              }
            } else {
              if (height > maxHeight) {
                width = Math.round((width * maxHeight) / height);
                height = maxHeight;
              }
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            // Exporta em Base64 formato JPEG comprimido
            const base64 = canvas.toDataURL('image/jpeg', quality);
            resolve(base64);
          };
          img.onerror = (err) => reject(err);
        };
        reader.onerror = (err) => reject(err);
      });
    }

    // Ouve as páginas em tempo real do Firebase
    const albumRef = ref(db, 'album_pages');
    onValue(albumRef, (snapshot) => {
      const data = snapshot.val();
      pagesData = [];
      if (data) {
        Object.keys(data).forEach(key => {
          pagesData.push({ id: key, ...data[key] });
        });
      }
      renderList();
    });

    function renderList() {
      itemsContainer.innerHTML = '';
      totalCount.textContent = pagesData.length;

      if (pagesData.length === 0) {
        itemsContainer.innerHTML = '<p style="color:#777;">Nenhuma página salva no Firebase.</p>';
        return;
      }

      pagesData.forEach((data, index) => {
        const item = document.createElement('div');
        item.className = 'page-item';
        item.innerHTML = `
          <img src="${data.image}">
          <div class="page-item-text">
            <strong>Página ${index + 1}:</strong>
            <p>${data.text || '<em>Sem texto</em>'}</p>
          </div>
          <button class="btn-delete" data-id="${data.id}">Excluir</button>
        `;
        itemsContainer.appendChild(item);
      });

      // Evento de exclusão
      document.querySelectorAll('.btn-delete').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const id = e.target.getAttribute('data-id');
          deletePage(id);
        });
      });
    }

    addBtn.addEventListener('click', async () => {
      const file = imageInput.files[0];
      const text = textInput.value.trim();

      if (!file) {
        alert('Por favor, selecione uma imagem.');
        return;
      }

      try {
        addBtn.disabled = true;
        addBtn.textContent = 'Compilando imagem e salvando...';

        // Compila e reduz a imagem para Base64 leve
        const compressedBase64 = await compressImageToBase64(file);

        // Salva no Firebase Realtime Database
        await push(ref(db, 'album_pages'), {
          image: compressedBase64,
          text: text,
          createdAt: Date.now()
        });

        imageInput.value = '';
        textInput.value = '';
        alert('Página enviada e salva no Firebase com sucesso!');
      } catch (err) {
        console.error(err);
        alert('Erro ao processar imagem e salvar no Firebase.');
      } finally {
        addBtn.disabled = false;
        addBtn.textContent = 'Adicionar Página ao Álbum';
      }
    });

    function deletePage(id) {
      if (confirm('Deseja realmente remover esta página do Firebase?')) {
        remove(ref(db, `album_pages/${id}`))
          .then(() => alert('Página excluída!'))
          .catch((err) => alert('Erro ao excluir: ' + err.message));
      }
    }
  </script>
</body>
</html>
